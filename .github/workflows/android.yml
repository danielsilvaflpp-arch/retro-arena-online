name: Retro Arena - Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar aplicativo Android
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/retro-app/www"
          cd "$RUNNER_TEMP/retro-app"
          npm init -y
          npm install --save-exact @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          printf '%s\n' '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Retro Arena</title></head><body>Conectando ao Retro Arena...</body></html>' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.retroarena.online","appName":"Retro Arena","webDir":"www","server":{"url":"https://retro-arena-online.onrender.com","cleartext":false}}
          JSON
          npx cap add android
          npx cap sync android
      - name: Compilar APK de teste
        shell: bash
        run: |
          cd "$RUNNER_TEMP/retro-app/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-output/Retro-Arena-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Retro-Arena-Android
          path: apk-output/Retro-Arena-Android.apk
          if-no-files-found: error
          retention-days: 30
