<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#game{width:100%;height:100%;margin:0;background:#080a10;color:white}</style></head><body><div id="game">Carregando emulador...</div><script>
// Preserve binary data when older EJS builds write external archives.
function patchManager(C){
 if(!C || !C.prototype || typeof C.prototype.writeFile !== 'function') return;
 const original=C.prototype.writeFile;
 C.prototype.writeFile=function(path,data,...rest){
  if(data instanceof ArrayBuffer) data=new Uint8Array(data);
  return original.call(this,path,data,...rest);
 };
}
let manager=window.EJS_GameManager;
if(manager) patchManager(manager);
else Object.defineProperty(window,'EJS_GameManager',{configurable:true,get(){return manager;},set(value){manager=value;patchManager(value);}});

window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||!e.data.file||window.EJS_gameUrl)return;const d=e.data;window.EJS_player='#game';window.EJS_core=['fbneo','snes','segaMD','nes','gb','gba','n64','psx'].includes(d.core)?d.core:'snes';if(d.core==='fbneo'){window.EJS_dontExtractRom=true;window.EJS_cacheConfig={enabled:false};if(d.bios){window.EJS_externalFiles={"/neogeo.zip":URL.createObjectURL(d.bios),["/"+d.file.name]:URL.createObjectURL(d.file)};}} window.EJS_gameUrl=URL.createObjectURL(d.file);window.EJS_gameName=d.core==='fbneo'?d.file.name:d.file.name.replace(/\.[^.]+$/, "");window.EJS_gameID=parseInt(d.digest.slice(0,12),16);window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_language='pt-BR';if(d.online){window.EJS_netplayServer=d.config.netplay;window.EJS_netplayICEServers=d.config.ice;}const s=document.createElement('script');s.src=window.EJS_pathtodata+'loader.js';s.onerror=()=>document.getElementById('game').textContent='Falha ao carregar EmulatorJS. Verifique a conexão.';document.body.append(s);});</script></body></html>
