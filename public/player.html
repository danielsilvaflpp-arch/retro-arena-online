<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#game{width:100%;height:100%;margin:0;background:#080a10;color:white}</style></head><body><div id="game">Carregando emulador...</div><script>window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||!e.data.file||window.EJS_gameUrl)return;const d=e.data;window.EJS_player='#game';window.EJS_core=d.core==='fbneo'?'fbneo':'snes';if(d.core==='fbneo'){window.EJS_dontExtractRom=true;if(d.bios){window.EJS_externalFiles={"/neogeo.zip":URL.createObjectURL(d.bios)};}} window.EJS_gameUrl=URL.createObjectURL(d.file);window.EJS_gameName=d.file.name.replace(/\.[^.]+$/, "");window.EJS_gameID=parseInt(d.digest.slice(0,12),16);window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_language='pt-BR';if(d.online){window.EJS_netplayServer=d.config.netplay;window.EJS_netplayICEServers=d.config.ice;}const s=document.createElement('script');s.src=window.EJS_pathtodata+'loader.js';s.onerror=()=>document.getElementById('game').textContent='Falha ao carregar EmulatorJS. Verifique a conexão.';document.body.append(s);});</script></body></html>
