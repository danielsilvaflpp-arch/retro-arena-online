<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Arena — Administração</title><link rel="stylesheet" href="/style.css?v=4"></head><body><header><b>RETRO<span>ARENA</span></b><a href="/">Voltar ao catálogo</a></header><main><article><h2>Administração / V4</h2><form id="login"><label>Senha administrativa<input type="password" id="password" required autocomplete="current-password"></label><button>Entrar</button></form><p id="status" role="status"></p></article><section id="panel" hidden><article><h2>Publicar jogo</h2><form id="publish"><label>Nome<input name="name" required maxlength="100"></label><label>Emulador<select name="core"><option value="fbneo">Neo Geo / Arcade</option><option value="snes">Super Nintendo</option><option value="segaMD">Mega Drive</option><option value="nes">NES</option><option value="gb">Game Boy</option><option value="gba">Game Boy Advance</option><option value="n64">Nintendo 64</option><option value="psx">PlayStation 1</option></select></label><label>Categoria<select name="category"><option>Luta</option><option>Ação</option><option>Corrida</option><option>Aventura</option><option>Esportes</option><option>Outros</option></select></label><label>ROM (até 50 MB)<input name="rom" type="file" required></label><label>BIOS Neo Geo ZIP (opcional)<input name="bios" type="file" accept=".zip"></label><label>Capa (PNG, JPEG ou WebP, até 2 MB)<input name="cover" type="file" accept="image/png,image/jpeg,image/webp"></label><label><input style="width:auto;display:inline" type="checkbox" name="authorized" value="yes" required> Tenho autorização para distribuir os arquivos e a capa publicamente.</label><button>Publicar jogo</button></form><p id="progress" role="status"></p></article><article><h2>Jogos publicados</h2><div id="items"></div></article><button id="logout">Sair</button></section></main><script src="/admin.js?v=4"></script></body></html>
